<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bedankt | RH Solutions</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f1e8;
      color: #111;
      padding: 25px;
    }

    .box {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 22px;
      padding: 50px 35px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,.12);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 17px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 22px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
    }

    .gold {
      color: #b88b23;
    }

  </style>
</head>

<body>

  <div class="box">

    <div class="icon">✅</div>

    <h1>
      Bedankt!
    </h1>

    <p>
      We hebben je energiefactuur goed ontvangen.
    </p>

    <p>
      <strong>RH Solutions</strong> bekijkt je aanvraag
      en neemt indien nodig contact met je op.
    </p>

    <p class="gold">
      Energie & telecom voor zelfstandigen.
    </p>

    <a
      class="button"
      href="index.html"
    >
      Terug naar RH Solutions
    </a>

  </div>

</body>
</html>
